services:
  # Redis Cache Service
  redis:
    image: redis:7.4-alpine
    container_name: stratic-plan-redis
    ports:
      - '6379:6379'
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-dev-redis-password}
    volumes:
      - redis-data:/data
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'redis-cli', '--no-auth-warning', '-a', '${REDIS_PASSWORD:-dev-redis-password}', 'ping']
      interval: 10s
      timeout: 3s
      retries: 3
    networks:
      - stratic-plan-network

  # Optional: PostgreSQL Admin Tool (pgAdmin)
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: stratic-plan-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@straticplan.local}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
      PGADMIN_CONFIG_SERVER_MODE: 'False'
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: 'False'
    ports:
      - '5050:80'
    volumes:
      - pgadmin-data:/var/lib/pgadmin
    restart: unless-stopped
    networks:
      - stratic-plan-network
    profiles:
      - tools

  # Optional: Redis Commander (Redis GUI)
  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: stratic-plan-redis-commander
    environment:
      REDIS_HOSTS: local:redis:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-dev-redis-password}
    ports:
      - '8081:8081'
    depends_on:
      - redis
    restart: unless-stopped
    networks:
      - stratic-plan-network
    profiles:
      - tools

volumes:
  redis-data:
    driver: local
  pgadmin-data:
    driver: local

networks:
  stratic-plan-network:
    driver: bridge
    name: stratic-plan-network

