# Cloud Development Environment
# Deploy this on a VPS for shared development services
# All developers connect to this single instance

services:
  # PostgreSQL Database (Supabase-compatible)
  postgres:
    image: supabase/postgres:15.1.0.117
    container_name: stratic-plan-postgres
    restart: unless-stopped
    environment:
      POSTGRES_HOST: /var/run/postgresql
      PGDATA: /var/lib/postgresql/data
      POSTGRES_PORT: 5432
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-in-production}
      JWT_SECRET: ${JWT_SECRET:-your-super-secret-jwt-token-with-at-least-32-characters-long}
      JWT_EXP: ${JWT_EXP:-3600}
    ports:
      - '54322:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - stratic-plan-network

  # PostgREST API
  postgrest:
    image: postgrest/postgrest:v12.2.3
    container_name: stratic-plan-postgrest
    restart: unless-stopped
    environment:
      PGRST_DB_URI: postgresql://postgres:${POSTGRES_PASSWORD:-change-me-in-production}@postgres:5432/postgres
      PGRST_DB_SCHEMAS: public,graphql_public
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: ${JWT_SECRET:-your-super-secret-jwt-token-with-at-least-32-characters-long}
    ports:
      - '54321:3000'
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - stratic-plan-network

  # GoTrue Auth Service
  gotrue:
    image: supabase/gotrue:v2.99.0
    container_name: stratic-plan-gotrue
    restart: unless-stopped
    environment:
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: 9999
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:-change-me-in-production}@postgres:5432/postgres
      GOTRUE_SITE_URL: ${SITE_URL:-http://localhost:3000}
      GOTRUE_URI_ALLOW_LIST: ${URI_ALLOW_LIST:-http://localhost:3000}
      GOTRUE_DISABLE_SIGNUP: 'false'
      GOTRUE_JWT_SECRET: ${JWT_SECRET:-your-super-secret-jwt-token-with-at-least-32-characters-long}
      GOTRUE_JWT_EXP: ${JWT_EXP:-3600}
      GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
      GOTRUE_EXTERNAL_EMAIL_ENABLED: 'true'
      GOTRUE_MAILER_AUTOCONFIRM: 'true'
    ports:
      - '9999:9999'
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - stratic-plan-network

  # Supabase Realtime
  realtime:
    image: supabase/realtime:v2.28.32
    container_name: stratic-plan-realtime
    restart: unless-stopped
    environment:
      PORT: 4000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: ${POSTGRES_PASSWORD:-change-me-in-production}
      DB_NAME: postgres
      DB_SSL: 'false'
      SECRET_KEY_BASE: ${REALTIME_SECRET_KEY_BASE:-your-secret-key-base-32-chars-minimum}
      JWT_SECRET: ${JWT_SECRET:-your-super-secret-jwt-token-with-at-least-32-characters-long}
    ports:
      - '4000:4000'
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - stratic-plan-network

  # Supabase Storage
  storage:
    image: supabase/storage-api:v1.11.1
    container_name: stratic-plan-storage
    restart: unless-stopped
    environment:
      ANON_KEY: ${ANON_KEY:-your-anon-key}
      SERVICE_KEY: ${SERVICE_ROLE_KEY:-your-service-role-key}
      POSTGREST_URL: http://postgrest:3000
      PGOPTIONS: -c search_path=storage,public
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:-change-me-in-production}@postgres:5432/postgres
      FILE_SIZE_LIMIT: 52428800
      STORAGE_BACKEND: file
      FILE_STORAGE_BACKEND_PATH: /var/lib/storage
      TENANT_ID: stratic-plan
      REGION: us-east-1
      GLOBAL_S3_BUCKET: stratic-plan
    ports:
      - '5000:5000'
    volumes:
      - storage-data:/var/lib/storage
    depends_on:
      - postgres
      - postgrest
    networks:
      - stratic-plan-network

  # Supabase Studio (Database UI)
  studio:
    image: supabase/studio:20240118-8c4e0b1
    container_name: stratic-plan-studio
    restart: unless-stopped
    environment:
      STUDIO_PG_META_URL: http://pg-meta:8080
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-in-production}
      DEFAULT_ORGANIZATION_NAME: Stratic Plan
      DEFAULT_PROJECT_NAME: Development
      SUPABASE_URL: http://postgrest:3000
      SUPABASE_PUBLIC_URL: ${PUBLIC_URL:-http://your-server-ip:54321}
      SUPABASE_ANON_KEY: ${ANON_KEY:-your-anon-key}
      SUPABASE_SERVICE_KEY: ${SERVICE_ROLE_KEY:-your-service-role-key}
    ports:
      - '54323:3000'
    depends_on:
      - postgres
      - postgrest
    networks:
      - stratic-plan-network

  # pg-meta (for Studio)
  pg-meta:
    image: supabase/postgres-meta:v0.91.6
    container_name: stratic-plan-pg-meta
    restart: unless-stopped
    environment:
      PG_META_PORT: 8080
      PG_META_DB_HOST: postgres
      PG_META_DB_PORT: 5432
      PG_META_DB_NAME: postgres
      PG_META_DB_USER: postgres
      PG_META_DB_PASSWORD: ${POSTGRES_PASSWORD:-change-me-in-production}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - stratic-plan-network

  # Kong API Gateway
  kong:
    image: kong:2.8.1
    container_name: stratic-plan-kong
    restart: unless-stopped
    environment:
      KONG_DATABASE: 'off'
      KONG_DECLARATIVE_CONFIG: /var/lib/kong/kong.yml
      KONG_DNS_ORDER: LAST,A,CNAME
      KONG_PLUGINS: request-id,cors,key-auth,acl,basic-auth
    ports:
      - '8000:8000'   # HTTP
      - '8443:8443'   # HTTPS
    volumes:
      - ./kong.yml:/var/lib/kong/kong.yml:ro
    depends_on:
      - postgrest
      - gotrue
      - storage
      - realtime
    networks:
      - stratic-plan-network

  # Redis Cache
  redis:
    image: redis:7.4-alpine
    container_name: stratic-plan-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-change-me-in-production} --appendonly yes
    ports:
      - '6379:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', '--no-auth-warning', '-a', '${REDIS_PASSWORD:-change-me-in-production}', 'ping']
      interval: 10s
      timeout: 3s
      retries: 3
    networks:
      - stratic-plan-network

  # Mailpit (Email Testing)
  mailpit:
    image: axllent/mailpit:latest
    container_name: stratic-plan-mailpit
    restart: unless-stopped
    ports:
      - '54324:8025'  # Web UI
      - '54325:1025'  # SMTP
    networks:
      - stratic-plan-network

volumes:
  postgres-data:
    driver: local
  storage-data:
    driver: local
  redis-data:
    driver: local

networks:
  stratic-plan-network:
    driver: bridge

